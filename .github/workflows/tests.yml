name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-api.txt -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest

  docker:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Télécharger le modèle depuis la release
        run: gh release download modele-v1 --pattern modele_cnn.pt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Construire l'image Docker
        run: docker build -t pneumonie-api .

      - name: Vérifier que l'API démarre
        run: |
          docker run -d -p 8000:8000 pneumonie-api
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/sante
